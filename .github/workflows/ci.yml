name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: etl_data_quality
          POSTGRES_USER: etl_user
          POSTGRES_PASSWORD: etl_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etl_user -d etl_data_quality"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Initialize database
        env:
          PGPASSWORD: etl_password
        run: psql -h localhost -U etl_user -d etl_data_quality -f sql/init.sql
      - name: Run tests with coverage
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://etl_user:etl_password@localhost:5432/etl_data_quality
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=60 -q
      - name: Run Ruff
        run: ruff check src tests scripts
      - name: Run Pyright
        run: pyright
